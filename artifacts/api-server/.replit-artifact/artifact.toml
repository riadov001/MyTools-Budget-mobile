kind = "api"
previewPath = "/api"
title = "API Server"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "API Server"
# Catch-all: in production this is the SINGLE service — it must receive every
# request (the API handles /api/*, the SPA fallback serves the PWA for the rest).
# In dev, the PWA workflow registers /budget-pwa/ which wins by longest-prefix
# match, so this catch-all does not conflict with the PWA preview.
paths = ["/"]

[services.development]
run = "pnpm --filter @workspace/api-server run dev"

[services.production]

[services.production.build]
args = ["node", "artifacts/api-server/scripts/build-prod.mjs"]

[services.production.build.env]
NODE_ENV = "production"

[services.production.run]
args = ["node", "--enable-source-maps", "artifacts/api-server/dist/index.mjs"]

[services.production.run.env]
PORT = "8080"
NODE_ENV = "production"

[services.production.health.startup]
path = "/api/healthz"
