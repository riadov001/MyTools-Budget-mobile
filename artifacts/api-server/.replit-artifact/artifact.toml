kind = "api"
previewPath = "/api"
title = "API Server"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "API Server"
# In dev, only /api is routed here (PWA dev server handles /budget-pwa/).
# In production this is the SINGLE deployed service — Autoscale routes all
# traffic to it, the API handles /api/* and the SPA fallback serves the PWA.
paths = ["/api"]

[services.development]
run = "pnpm --filter @workspace/api-server run dev"

[services.production]

[services.production.build]
# Builds the PWA + the api-server bundle and copies the PWA into dist/public.
# This consolidates everything into a single Autoscale-friendly web service.
args = ["node", "artifacts/api-server/scripts/build-prod.mjs"]

[services.production.build.env]
NODE_ENV = "production"

[services.production.run]
args = ["node", "--enable-source-maps", "artifacts/api-server/dist/index.mjs"]

[services.production.run.env]
PORT = "8080"
NODE_ENV = "production"

[services.production.health.startup]
path = "/api/healthz"
