kind = "mobile"
previewPath = "/"
title = "Budget by MyTools"
version = "1.0.0"
id = "artifacts/budget-mobile"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/" ]
localPort = 19496

[services.development]
run = "pnpm --filter @workspace/budget-mobile run dev"

# No [services.production] block — the mobile app is published via EAS Build
# (App Store / Play Store), not via Replit Autoscale.

[services.env]
PORT = "19496"
BASE_PATH = "/"
