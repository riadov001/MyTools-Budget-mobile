kind = "web"
previewPath = "/budget-pwa/"
title = "Budget PWA"
version = "1.0.0"
id = "artifacts/budget-pwa"

[[services]]
localPort = 5173
name = "Budget PWA"
paths = ["/budget-pwa/"]

[services.env]
PORT = "5173"
BASE_PATH = "/budget-pwa/"
API_PORT = "8080"

[services.development]
run = "pnpm --filter @workspace/budget-pwa run dev"

# No [services.production] block — in production, the PWA is bundled into
# the api-server's dist/public/ and served by it as a single web service.
