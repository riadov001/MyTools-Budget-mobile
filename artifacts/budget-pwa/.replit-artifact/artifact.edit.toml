kind = "web"
previewPath = "/"
title = "Budget PWA"
version = "1.0.0"
id = "artifacts/budget-pwa"

[[services]]
localPort = 5173
name = "Budget PWA"
paths = ["/"]

[services.env]
PORT = "5173"
BASE_PATH = "/"
API_PORT = "8080"

[services.development]
run = "pnpm --filter @workspace/budget-pwa run dev"

[services.production.build]
args = ["pnpm", "--filter", "@workspace/budget-pwa", "run", "build"]

[services.production.run]
args = ["node", "artifacts/budget-pwa/server.js"]
